[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "creative-agent"
version = "0.1.0"
description = "Agent harness framework with doctrine-driven design-review agents (sutton-review)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ian Shank" }]
# POSIX is the tested platform. `review` and `state show` need advisory file locking, and
# `assets validate` reads the execute bit; both are handled portably (harness/filelock.py,
# harness/assets.py) but no Windows CI leg exists, so the classifier states what is
# actually verified rather than what might work. See docs/roadmap.md 4.2.
classifiers = [
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "PyYAML>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "httpx>=0.27",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
llm = ["claude-agent-sdk>=0.1"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-randomly>=3.15",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    "diff-cover>=9.0",
    "mutmut>=3.7,<4",
]

[project.scripts]
creative-agent = "creative_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/creative_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# T20 (flake8-print) enforces CLAUDE.md's "never `print`" rule, which until now was
# enforced by nothing and was already violated in `cli.py`'s top-level error handler.
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF", "DTZ", "S", "TID", "T20"]
# Deliberately empty. `S101` (assert) and `PLR2004` (magic value in a comparison) were
# ignored here with comments that justified them "in tests" — while applying to `src/` too.
# PLR2004 is the lint for CLAUDE.md's headline convention ("never hard-code severity caps,
# gate lists, or thresholds in Python"), so the repository had globally disabled its own
# enforcement of its own first rule. Both are now per-file ignores under `tests/**`.
ignore = []

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Inject harness.protocols.Clock instead (determinism policy, DEC-F8)."
"datetime.datetime.utcnow".msg = "Inject harness.protocols.Clock instead (determinism policy, DEC-F8)."
"datetime.date.today".msg = "Inject harness.protocols.Clock instead (determinism policy, DEC-F8)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR0913", "PLR0917", "DTZ001", "DTZ011", "S101", "PLR2004", "T20"]
# scripts are console tools: printing IS their output channel, and the harness logger is
# for the library. They are not imported by `src/`.
"scripts/**" = ["S", "PLC0415", "T20", "PLR2004"]
# Greek-letter character classes in the symbol-definition regexes are intentional.
"src/creative_agent/harness/consistency.py" = ["RUF001"]
# The pipeline orchestrates many injected components; the arg/statement counts are the
# design, not an accident. Renderer builds one long document.
"src/creative_agent/harness/pipeline.py" = ["PLR0913", "PLR0915", "PLR0912"]
"src/creative_agent/harness/rendering.py" = ["PLR0915"]
# prompting: function-level import breaks a models<->harness cycle; autoescape=False is
# correct for plain-text prompts (no HTML sink).
"src/creative_agent/harness/prompting.py" = ["PLC0415", "S701"]
# cli is the composition root: heavy/optional deps (SDK, pipeline) import lazily per
# command, and typer commands legitimately take many options.
"src/creative_agent/cli.py" = ["PLC0415", "PLR0913", "PLR0917"]
# claude_sdk imports the optional SDK lazily so the [llm] extra stays optional.
"src/creative_agent/harness/llm/claude_sdk.py" = ["PLC0415"]
# citation resolver: the early-return dispatch over resolution outcomes is the design.
"src/creative_agent/harness/citations.py" = ["PLR0911"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["creative_agent"]

[[tool.mypy.overrides]]
module = ["claude_agent_sdk.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# --strict-markers: an unregistered marker is a typo, and a typo'd marker silently does
# nothing — `@pytest.mark.liv` would quietly opt a test out of nothing at all while
# reading as if it had. With it, the typo fails collection instead.
addopts = "--cov=creative_agent --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=90 -m 'not live' --strict-markers"
markers = [
    "live: tests that call the real Claude Agent SDK (require ANTHROPIC_API_KEY; run by live.yml)",
]
# Warnings are errors: a DeprecationWarning from a dependency is the notice that a future
# upgrade will break the harness, and printed among 500 dots nobody reads it. The suite
# currently raises none, so the list below carries no allowances — anything added here
# needs a comment saying which dependency raises it and why it cannot be fixed instead.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["creative_agent"]

[tool.coverage.report]
# claude_sdk.py is exercised via mocked-transport unit tests and the weekly live workflow;
# it is excluded from the line/branch gate so SDK event plumbing cannot be met with fake
# coverage. Policy: DEC-F8 — any new omit entry requires a decision-log entry.
omit = ["*/harness/llm/claude_sdk.py"]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

[tool.importlinter]
root_package = "creative_agent"

[[tool.importlinter.contracts]]
name = "harness must not import agents"
type = "forbidden"
source_modules = ["creative_agent.harness", "creative_agent.models"]
forbidden_modules = ["creative_agent.agents"]

[tool.mutmut]
# mutmut 3.x takes a LIST of paths under `source_paths`; the 2.x string form silently
# iterated characters, so the tool never ran. Scoped to the enforcement core, where a
# surviving mutant means a softened rule.
source_paths = [
    "src/creative_agent/harness/severity.py",
    "src/creative_agent/harness/gates.py",
    "src/creative_agent/harness/verification.py",
    "src/creative_agent/harness/consistency.py",
]
# `tests_dir` is deprecated in 3.x AND breaks the run (it is concatenated with the list
# below), so test selection lives entirely in pytest_add_cli_args_test_selection.
#
# Scoped to the four direct unit-test files for the mutated modules, not all of
# tests/unit/. Two reasons, found by running this and reading the failures: (1) mutmut
# copies mutants/ as a nested, non-git directory, so tests whose behavior depends on
# `git rev-parse --show-toplevel` or `$CLAUDE_PROJECT_DIR` resolving to the *sandbox* root
# (TestHookBehaviour subprocess-running .claude/hooks/validate-data.sh) silently validate
# the real repo instead and pass for the wrong reason, or fail outright when they expect a
# blocking exit code; (2) collecting the whole directory pulls in every top-level import
# across tests/unit — cli.py, scripts/, .claude/ — none of which the enforcement core
# needs, so each would otherwise need mirroring into the sandbox via also_copy just to
# satisfy imports that have nothing to do with what mutation testing is scoped to verify.
pytest_add_cli_args_test_selection = [
    "tests/unit/test_severity.py",
    "tests/unit/test_gates.py",
    "tests/unit/test_verification.py",
    "tests/unit/test_consistency.py",
    "-x",
    "-q",
    "--no-cov",
    "-p",
    "no:randomly",
    # `filterwarnings = ["error"]` promotes an unraisable warning to a failure, and under
    # mutmut's multi-process re-import model a garbage-collected ScandirIterator surfaces
    # as exactly that at interpreter shutdown — observed once in a 470-mutant run. A
    # failure for that reason would be counted as a KILL, silently hiding a mutant that
    # actually survived: the same false-green class the population guard in
    # scripts/check_mutation_baseline.py exists to close. Ignoring it here errs the other
    # way, toward a survivor the gate reports, and is scoped to the mutmut invocation so
    # the main suite keeps warnings-as-errors.
    "-W",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
# mutmut only copies the four files named in source_paths into mutants/ — walk_all_files()
# walks exactly that list, nothing else. The four test files above (plus tests/factories.py)
# import several other creative_agent submodules (models/oracle.py, models/findings.py,
# harness/llm/base.py, ...), so the whole package is mirrored; create_mutants() then
# overwrites the four target files with actual mutations, so this cannot mask a mutation.
also_copy = ["src/creative_agent"]
