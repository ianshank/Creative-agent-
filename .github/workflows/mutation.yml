name: Mutation testing

# The enforcement core (severity capping, gates, verification, consistency) is where a
# softened comparison is the worst silent failure the harness can have. Line and branch
# coverage cannot see that; a surviving mutant can. Weekly rather than per-PR because a
# full run is slow (a few minutes, not seconds).
#
# A real gate, not advisory: mutmut only copies the four files named in
# [tool.mutmut].source_paths into ./mutants — `also_copy` mirrors the rest of the package
# so the sandbox's own test collection can resolve creative_agent's other submodules (this
# was the actual sandbox problem, not package metadata as first suspected — found by
# reproducing the failure locally and reading mutmut's own copy logic). Kill-rate
# regressions fail the job via scripts/check_mutation_baseline.py against
# docs/mutation-baseline.json (currently 452/452 killed, 0 survived/no_tests/suspicious/
# timeout) rather than continue-on-error swallowing them.

on:
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-extras --locked
      - name: Run mutation testing on the enforcement core
        run: uv run mutmut run --max-children 4
      - name: Report results
        if: always()
        run: uv run mutmut results || true
      - name: Export CI/CD stats
        if: always()
        run: uv run mutmut export-cicd-stats
      - name: Enforce the kill-rate baseline
        if: always()
        run: uv run python scripts/check_mutation_baseline.py
