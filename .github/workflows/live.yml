name: Live SDK verification

# Weekly: run the live-marked tests against the real Claude Agent SDK and refresh the
# recorded transcript fixtures that the mocked-transport tests replay. Secret-gated —
# never runs on fork PRs.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    if: github.repository == 'ianshank/Creative-agent-'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-extras --locked
      # Without this the job is decorative: every live-marked test skips itself when the
      # key is absent, so pytest exits 0 and the workflow reports success having verified
      # nothing against the real SDK — the one thing it exists to do. Fail here, before
      # pytest, so the cause is the message rather than a green run to be interpreted.
      - name: Require ANTHROPIC_API_KEY before running anything
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set for this repository. The live" \
                 "tests skip themselves without it, so this job would pass having" \
                 "exercised nothing. Add the secret (Settings -> Secrets and variables" \
                 "-> Actions) or disable this workflow; do not leave it green and empty."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is present; the live tests will actually run."
      - name: Run live tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run pytest -m live --no-cov -q
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Live SDK verification failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The weekly live run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. The Claude Agent SDK surface may have drifted from the mocked-transport fixtures.`,
            });
