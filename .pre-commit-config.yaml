repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml, --redact]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^tests/golden/
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
  - repo: local
    hooks:
      # The doctrine table is the product; a schema break must never reach a commit.
      - id: oracle-validate
        name: validate oracle data
        entry: uv run creative-agent oracles validate --all
        language: system
        files: ^src/creative_agent/data/oracles/.*\.yaml$
        pass_filenames: false
